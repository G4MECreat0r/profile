<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロファイル</title>
<style>
  body{margin:0;padding:40px 20px;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#0b1220;color:#e2e8f0;text-align:center;line-height:1.7}
  .wrap{max-width:440px;margin:0 auto}
  h1{font-size:18px;font-weight:600}
  p{font-size:13px;opacity:.7}
  a.btn{display:block;margin:20px 0;padding:16px;border-radius:12px;background:#2563eb;color:#fff;
    text-decoration:none;font-size:15px;font-weight:600}
  .note{font-size:12px;opacity:.55;text-align:left;border:1px solid #1e293b;border-radius:10px;padding:12px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <h1>成人向け制限を解除するプロファイル</h1>
  <p>iPhoneのSafariでこのページを開いてください</p>

  <a class="btn" href="profiles/adult.mobileconfig">プロファイルをダウンロード</a>

  <div class="note">
    1. 上のボタンをタップ<br>
    2. 「プロファイルがダウンロードされました」をタップ<br>
    3. 設定 → 一般 → VPNとデバイス管理 → インストール<br>
    4. 端末のパスコードを入力<br><br>
    ※ 必ずSafariで開いてください。Chromeなどでは開けないことがあります。
  </div>
</div>
</body>
</html>
